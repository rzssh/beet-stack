name: Deploy to Railway

# DISABLED - Remove this line to enable the workflow
on:
  # push:
  #   branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

env:
  RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'production' }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Install Railway CLI
        run: |
          curl -fsSL https://railway.app/install.sh | sh
          echo "$HOME/.railway/bin" >> $GITHUB_PATH
          
      - name: Verify Railway CLI
        run: railway version
        
      - name: Set Railway Environment
        run: |
          if [ "${{ github.event.inputs.environment }}" = "staging" ]; then
            railway environment staging
          else
            railway environment production
          fi
          
      - name: Deploy to Railway
        run: railway up --detach
        
      - name: Configure Environment Variables
        run: |
          # Set production environment variables
          railway variables set NODE_ENV="${{ github.event.inputs.environment || 'production' }}"
          
          # Set secrets from GitHub repository secrets
          railway variables set AUTH_SECRET="${{ secrets.AUTH_SECRET }}"
          railway variables set DISCORD_CLIENT_ID="${{ secrets.DISCORD_CLIENT_ID }}"
          railway variables set DISCORD_CLIENT_SECRET="${{ secrets.DISCORD_CLIENT_SECRET }}"
          
          # Optional variables (only set if they exist)
          if [ -n "${{ secrets.RESEND_API_KEY }}" ]; then
            railway variables set RESEND_API_KEY="${{ secrets.RESEND_API_KEY }}"
          fi
          
          if [ -n "${{ secrets.STRIPE_SECRET_KEY }}" ]; then
            railway variables set STRIPE_SECRET_KEY="${{ secrets.STRIPE_SECRET_KEY }}"
            railway variables set STRIPE_WEBHOOK_SECRET="${{ secrets.STRIPE_WEBHOOK_SECRET }}"
          fi
          
          if [ -n "${{ secrets.AWS_ACCESS_KEY_ID }}" ]; then
            railway variables set AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}"
            railway variables set AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}"
            railway variables set AWS_REGION="${{ secrets.AWS_REGION || 'us-east-1' }}"
            railway variables set AWS_S3_BUCKET="${{ secrets.AWS_S3_BUCKET }}"
          fi
          
      - name: Wait for Deployment
        run: |
          echo "Waiting for deployment to complete..."
          sleep 30
          
      - name: Get Deployment URL
        run: |
          URL=$(railway status --json | jq -r '.deployments[0].url // empty')
          if [ -n "$URL" ]; then
            echo "🚀 Deployed to: $URL"
            echo "DEPLOYMENT_URL=$URL" >> $GITHUB_ENV
            
            # Update CORS and Auth URLs with actual deployment URL
            railway variables set AUTH_URL="$URL"
            railway variables set CORS_ORIGINS="$URL,expo://,exp://"
          fi
          
      - name: Health Check
        run: |
          if [ -n "$DEPLOYMENT_URL" ]; then
            echo "Performing health check..."
            for i in {1..10}; do
              if curl -f "$DEPLOYMENT_URL/api/health"; then
                echo "✅ Health check passed!"
                exit 0
              fi
              echo "⏳ Attempt $i/10 failed, retrying in 10s..."
              sleep 10
            done
            echo "❌ Health check failed after 10 attempts"
            exit 1
          fi
          
      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const url = process.env.DEPLOYMENT_URL;
            if (url) {
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `🚀 **Railway Deployment Successful!**
                
                **Environment**: ${{ github.event.inputs.environment || 'production' }}
                **URL**: ${url}
                **Health Check**: ${url}/api/health
                **Swagger Docs**: ${url}/swagger
                
                **OAuth Callback URLs to update:**
                - Discord: \`${url}/api/auth/callback/discord\`
                `
              });
            }
