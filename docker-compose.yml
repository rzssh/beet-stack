services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-messages}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - beet-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: beet-stack:latest
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      SERVICE_PORT: "3001"
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-messages}
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET to a random string of at least 32 characters}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-https://beet.example}
    ports:
      - "3001:3001"
    healthcheck:
      test:
        - CMD-SHELL
        - "bun -e \"(async()=>{try{const r=await fetch('http://127.0.0.1:'+(process.env.SERVICE_PORT||'3001')+'/health');if(!r.ok)process.exit(1)}catch{process.exit(1)}})()\""
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  beet-postgres:
