# Coolify deployment configuration
# Place this file in your project root

version: "3.8"

services:
  # Main API application
  app:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3001
      # Database connection to Coolify-managed PostgreSQL
      DATABASE_URL: "postgresql://postgres:${DB_PASSWORD}@coolify-postgres:5432/elysia_app"
      # Auth configuration
      AUTH_SECRET: "${AUTH_SECRET}"
      AUTH_URL: "https://${DOMAIN_NAME}"
      AUTH_TRUSTED_ORIGINS: "https://${FRONTEND_DOMAIN},expo://,exp://"
      # OAuth providers
      DISCORD_CLIENT_ID: "${DISCORD_CLIENT_ID}"
      DISCORD_CLIENT_SECRET: "${DISCORD_CLIENT_SECRET}"
      # Optional: Email service
      RESEND_API_KEY: "${RESEND_API_KEY}"
      # Optional: Stripe payments
      STRIPE_SECRET_KEY: "${STRIPE_SECRET_KEY}"
      STRIPE_WEBHOOK_SECRET: "${STRIPE_WEBHOOK_SECRET}"
      # Optional: AWS S3 storage
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY}"
      AWS_REGION: "${AWS_REGION}"
      AWS_S3_BUCKET: "${AWS_S3_BUCKET}"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    labels:
      # Coolify configuration
      - "coolify.managed=true"
      # Traefik routing
      - "traefik.enable=true"
      - "traefik.http.routers.app.rule=Host(\`${DOMAIN_NAME}\`)"
      - "traefik.http.routers.app.entrypoints=websecure"
      - "traefik.http.routers.app.tls=true"
      - "traefik.http.routers.app.tls.certresolver=letsencrypt"
      - "traefik.http.services.app.loadbalancer.server.port=3001"
      # Health check configuration
      - "traefik.http.routers.app.middlewares=app-health"
      - "traefik.http.middlewares.app-health.healthcheck.path=/api/health"
      - "traefik.http.middlewares.app-health.healthcheck.interval=30s"
    networks:
      - coolify
    depends_on:
      - postgres

  # PostgreSQL database (managed by Coolify)
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: elysia_app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/vps/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d elysia_app"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    labels:
      - "coolify.managed=true"
    networks:
      - coolify

  # Redis for caching and sessions (optional)
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --requirepass "${REDIS_PASSWORD}"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    labels:
      - "coolify.managed=true"
    networks:
      - coolify

volumes:
  postgres_data:
    driver: local
    labels:
      - "coolify.managed=true"
  redis_data:
    driver: local
    labels:
      - "coolify.managed=true"

networks:
  coolify:
    external: true
